<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMM-AR | PUBG GFX Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <header class="m3-toolbar">
        <div class="toolbar-left">
            <span class="material-symbols-outlined icon-btn">menu</span>
            <span class="m3-title">CMM-AR</span>
        </div>
        
        <div class="toolbar-right">
            <div class="lang-switch" onclick="toggleLanguage()">
                <span id="current-lang">EN</span>
                <span class="material-symbols-outlined">language</span>
            </div>
            <span class="material-symbols-outlined icon-btn">more_vert</span>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2 id="hero-title" class="m3-headline">Optimize Your PUBG Experience</h2>
            <p id="hero-desc" class="m3-body">The most advanced GFX tool for PUBG Mobile. Unlock 90 FPS, HDR graphics, and lag-free gameplay with Material 3 integration.</p>
            
            <a href="#download-section" class="m3-btn-filled">
                <span class="material-symbols-outlined">download</span>
                <span id="btn-main-dl">Download GfxTool</span>
            </a>
        </section>

        <section id="download-section" class="m3-card">
            <h3 id="card-gfx-title" class="m3-title-large">GfxTool Versions</h3>
            <div class="card-content">
                <button class="m3-btn-tonal full-width">
                    Download For Android 11 (Without Shizuku)
                </button>
                <button class="m3-btn-tonal full-width">
                    Download For Android 11+ (With Shizuku)
                </button>
            </div>
        </section>

        <section class="m3-card">
            <h3 id="card-pubg-title" class="m3-title-large">PUBG Original APK + OBB</h3>
            <p id="card-pubg-desc" class="m3-body-small">Download official versions directly.</p>
            <div class="button-grid">
                <button class="m3-btn-outline">PUBG Global</button>
                <button class="m3-btn-outline">PUBG Korea</button>
                <button class="m3-btn-outline">PUBG Vietnam</button>
                <button class="m3-btn-outline">PUBG Taiwan</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
